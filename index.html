<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ore Roller RNG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171a2b;
      --accent: #6ae3ff;
      --text: #e7ecf7;
      --muted: #9aa3b2;
      --good: #6aff9e;
      --bad: #ff6a6a;
    }
    body {
      margin: 0; font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 10%, #1b2040 0%, #0f1220 60%) fixed;
      color: var(--text);
      display: grid; place-items: center; min-height: 100vh;
    }
    .wrap {
      width: min(1000px, 92vw);
      display: grid; gap: 16px;
      grid-template-columns: 1.2fr 1fr;
      align-items: start;
    }
    header, .card { background: var(--panel); border: 1px solid #242a44; border-radius: 12px; padding: 16px; }
    header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 1.3rem; letter-spacing: 0.5px; }
    button {
      background: linear-gradient(180deg, #2a325a, #1f274a);
      color: var(--text); border: 1px solid #2f3866; border-radius: 10px;
      padding: 12px 18px; font-weight: 700; cursor: pointer;
      transition: transform .06s ease, filter .2s ease, box-shadow .2s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.04);
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px) scale(0.99); }
    .roll-btn { font-size: 1.05rem; }
    .stats { display: flex; gap: 12px; color: var(--muted); font-size: .95rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .ore-list { display: grid; gap: 8px; }
    .ore {
      display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
      padding: 10px; border-radius: 10px; background: #12152a; border: 1px solid #252b4b;
    }
    .badge {
      width: 12px; height: 12px; border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(255,255,255,.03) inset;
    }
    .ore-name { font-weight: 700; }
    .ore-odds { font-size: .85rem; color: var(--muted); }
    .inv { background: #111425; border: 1px dashed #2a3155; padding: 10px; border-radius: 10px; }
    .inv h3 { margin: 0 0 8px 0; font-size: 1rem; color: var(--accent); }
    .inv-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .inv-item { display: flex; justify-content: space-between; background: #0d1122; border: 1px solid #20274a; padding: 8px 10px; border-radius: 8px; }
    .log { max-height: 260px; overflow:auto; background: #0d1122; border:1px solid #22294a; border-radius: 10px; padding: 10px; }
    .log h3 { margin: 0 0 8px 0; font-size: 1rem; color: var(--accent); }
    .entry { font-size: .92rem; padding: 6px 8px; border-bottom: 1px dashed #22294a; }
    .entry:last-child { border-bottom: none; }
    .got { color: var(--good); }
    .miss { color: var(--muted); }
    .bar {
      height: 8px; border-radius: 6px; background: #0f1430; border:1px solid #27305a; overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .bar > div { height: 100%; background: linear-gradient(90deg, #6ae3ff, #8ef5c2); width: 0%; transition: width .25s ease; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .note { color: var(--muted); font-size: .85rem; }
    @media (max-width: 860px) {
      .wrap { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .inv-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Ore Roller RNG</h1>
      <div class="controls">
        <button id="rollBtn" class="roll-btn">Roll</button>
        <button id="auto10">Roll x10</button>
        <button id="auto100">Roll x100</button>
        <button id="resetBtn" title="Clear inventory and log">Reset</button>
      </div>
    </header>

    <div class="card">
      <div class="stats">
        <div>Total Rolls: <strong id="totalRolls">0</strong></div>
        <div>Find Rate: <strong id="findRate">0%</strong></div>
      </div>
      <div class="bar" style="margin:10px 0 16px 0;"><div id="findBar"></div></div>

      <div class="grid">
        <div>
          <h3 style="margin:0 0 10px 0;">Ores & Odds</h3>
          <div id="oreList" class="ore-list"></div>
          <p class="note">Each roll has an independent chance to land exactly one ore, weighted by rarity. If no ore is selected, it’s a miss.</p>
        </div>
        <div class="inv">
          <h3>Inventory</h3>
          <div id="invList" class="inv-list"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="log">
        <h3>Recent Rolls</h3>
        <div id="logEntries"></div>
      </div>
    </div>
  </div>

  <script>
    // Define ores with friendly names, colors, and odds expressed as "1 in N".
    // Lower 'oneIn' = more common.
    const ORES = [
      { key:'dirt',    name:'Dirt',     color:'#8b5a2b', oneIn: 2,   rarity:'Common' },
      { key:'rock',    name:'Rock',     color:'#7a7f87', oneIn: 4,   rarity:'Common' },
      { key:'coal',    name:'Coal',     color:'#2f3136', oneIn: 6,   rarity:'Common' },
      { key:'copper',  name:'Copper',   color:'#c77943', oneIn: 10,  rarity:'Uncommon' },
      { key:'iron',    name:'Iron',     color:'#b8bfc7', oneIn: 16,  rarity:'Uncommon' },
      { key:'silver',  name:'Silver',   color:'#dfe6ee', oneIn: 24,  rarity:'Uncommon' },
      { key:'gold',    name:'Gold',     color:'#ffd24a', oneIn: 40,  rarity:'Rare' },
      { key:'ruby',    name:'Ruby',     color:'#ff4d6d', oneIn: 80,  rarity:'Epic' },
      { key:'sapphire',name:'Sapphire', color:'#4da3ff', oneIn: 120, rarity:'Epic' },
      { key:'emerald', name:'Emerald',  color:'#40e0a8', oneIn: 160, rarity:'Legendary' },
      { key:'diamond', name:'Diamond',  color:'#82fff6', oneIn: 240, rarity:'Mythic' },
      { key:'obsidian',name:'Obsidian', color:'#3a0c5a', oneIn: 360, rarity:'Mythic' },
      { key:'mythril', name:'Mythril',  color:'#a9fffe', oneIn: 480, rarity:'Relic' },
      { key:'starlite',name:'Starlite', color:'#b986ff', oneIn: 720, rarity:'Relic' }
    ];

    // Inventory and stats state
    const inventory = Object.fromEntries(ORES.map(o => [o.key, 0]));
    let totalRolls = 0;
    let totalFinds = 0;

    // DOM elements
    const oreListEl = document.getElementById('oreList');
    const invListEl = document.getElementById('invList');
    const logEl = document.getElementById('logEntries');
    const totalRollsEl = document.getElementById('totalRolls');
    const findRateEl = document.getElementById('findRate');
    const findBarEl = document.getElementById('findBar');
    const rollBtn = document.getElementById('rollBtn');
    const auto10Btn = document.getElementById('auto10');
    const auto100Btn = document.getElementById('auto100');
    const resetBtn = document.getElementById('resetBtn');

    // Render ore odds panel
    function renderOres() {
      oreListEl.innerHTML = '';
      ORES.forEach(o => {
        const row = document.createElement('div');
        row.className = 'ore';
        row.innerHTML = `
          <div class="badge" style="background:${o.color}"></div>
          <div>
            <div class="ore-name">${o.name} <span class="ore-odds">(${o.rarity})</span></div>
            <div class="ore-odds">1 in ${o.oneIn} per individual check</div>
          </div>
          <div class="ore-odds">${(100 / o.oneIn).toFixed(2)}%</div>
        `;
        oreListEl.appendChild(row);
      });
    }

    // Render inventory
    function renderInventory() {
      invListEl.innerHTML = '';
      ORES.forEach(o => {
        const it = document.createElement('div');
        it.className = 'inv-item';
        it.innerHTML = `
          <span><span class="badge" style="display:inline-block; margin-right:8px; background:${o.color}"></span>${o.name}</span>
          <strong>${inventory[o.key]}</strong>
        `;
        invListEl.appendChild(it);
      });
    }

    // Update stats
    function updateStats() {
      totalRollsEl.textContent = totalRolls;
      const rate = totalRolls ? (100 * totalFinds / totalRolls) : 0;
      findRateEl.textContent = rate.toFixed(2) + '%';
      findBarEl.style.width = Math.min(100, rate).toFixed(2) + '%';
    }

    // Log helper
    function log(message, cls='') {
      const div = document.createElement('div');
      div.className = 'entry ' + cls;
      const time = new Date().toLocaleTimeString();
      div.textContent = `[${time}] ${message}`;
      logEl.prepend(div);
      // cap log size
      const MAX = 150;
      while (logEl.children.length > MAX) logEl.removeChild(logEl.lastChild);
    }

    // RNG mechanics:
    // We do independent Bernoulli checks from common to rare until one hits.
    // This makes common ores much more likely than rare ones. If none hit, it's a miss.
    function rollOnce() {
      totalRolls += 1;
      let found = null;

      for (const o of ORES) {
        // Chance 1 in N
        if (Math.floor(Math.random() * o.oneIn) === 0) {
          found = o;
          break;
        }
      }

      if (found) {
        totalFinds += 1;
        inventory[found.key] += 1;
        log(`You found ${found.name}! [~${(100/found.oneIn).toFixed(2)}% check]`, 'got');
      } else {
        log(`No ore found this roll.`, 'miss');
      }

      renderInventory();
      updateStats();
    }

    // Batch rolls
    async function rollBatch(n, delayMs=0) {
      rollBtn.disabled = true;
      auto10Btn.disabled = true;
      auto100Btn.disabled = true;
      for (let i=0; i<n; i++) {
        rollOnce();
        if (delayMs) await new Promise(r => setTimeout(r, delayMs));
      }
      rollBtn.disabled = false;
      auto10Btn.disabled = false;
      auto100Btn.disabled = false;
    }

    // Controls
    rollBtn.addEventListener('click', () => rollBatch(1));
    auto10Btn.addEventListener('click', () => rollBatch(10, 40));
    auto100Btn.addEventListener('click', () => rollBatch(100, 10));

    resetBtn.addEventListener('click', () => {
      if (!confirm('Reset inventory and log?')) return;
      for (const k in inventory) inventory[k] = 0;
      totalRolls = 0; totalFinds = 0;
      logEl.innerHTML = '';
      renderInventory();
      updateStats();
      log('Game reset.', 'miss');
    });

    // Init
    renderOres();
    renderInventory();
    updateStats();

    // Optional: keyboard shortcut (space to roll)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        rollBatch(1);
      }
    });
  </script>
</body>
</html>
